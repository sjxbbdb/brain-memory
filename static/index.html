<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Memory v4.2</title>
<style>
:root {
  --bg: #06060f;
  --surface: #0e0e20;
  --card: #111128;
  --border: #1a1a3a;
  --text: #c8d0e0;
  --dim: #555570;
  --accent: #8b7cf0;
  --accent-glow: #a99ff8;
  --green: #2ecc71;
  --red: #e74c3c;
  --orange: #f39c12;
  --blue: #5dade2;
  --pink: #e87da0;
  --dream: #2c1654;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 15px;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
}

/* ── 顶部状态条 ── */
.topbar {
  display: flex;
  align-items: center;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-shrink: 0;
  background: var(--surface);
}
.topbar .logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
}
.topbar .logo span { color: var(--accent); }
.topbar .sep { width: 1px; height: 18px; background: var(--border); }
.topbar .metric { font-size: 13px; color: var(--dim); }
.topbar .metric b { color: var(--text); font-weight: 600; }
.topbar .state-badge {
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-left: auto;
}
.state-awake    { background: #0a2a1a; color: var(--green); }
.state-drowsy   { background: #1a1a0a; color: var(--orange); }
.state-sleeping { background: #1a0a2a; color: #9b59b6; }
.state-dreaming { background: var(--dream); color: #c39bdb; }

/* ── 主布局 ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: auto 1fr;
  gap: 1px;
  background: var(--border);
  overflow: hidden;
}

/* ── 独白区（主角） ── */
.monologue-zone {
  grid-column: 1;
  grid-row: 1;
  background: var(--surface);
  padding: 32px 36px;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 100px;
}
.monologue-zone .quote-mark {
  font-size: 56px;
  color: var(--accent);
  opacity: 0.3;
  flex-shrink: 0;
  line-height: 1;
  font-family: Georgia, serif;
}
.monologue-zone .monologue-text {
  font-size: 22px;
  line-height: 1.8;
  color: #d8dce8;
  font-style: italic;
  transition: opacity 0.6s;
}
.monologue-zone .monologue-text.thinking::after {
  content: '...';
  animation: dots 1.5s infinite;
}
@keyframes dots { 0%,20%{content:'.'} 40%,60%{content:'..'} 80%,100%{content:'...'} }
.monologue-zone .monologue-text:empty::after {
  content: '正在感知世界...';
  color: var(--dim);
  font-style: normal;
}

/* ── 记忆区 ── */
.memory-zone {
  grid-column: 1;
  grid-row: 2;
  background: var(--bg);
  overflow-y: auto;
  padding: 20px 24px;
}
.memory-zone .section-title {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 2px;
  margin-bottom: 16px;
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 4px 0;
  z-index: 1;
}
.memory-zone .section-title::before { content: '◆ '; color: var(--accent); font-size: 7px; }
.mem-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.mem-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  transition: border-color 0.3s;
}
.mem-card:hover { border-color: var(--accent); }
.mem-card.identity { border-left: 2px solid var(--accent); }
.mem-card .mem-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
}
.mem-card .mem-title {
  font-size: 15px;
  font-weight: 700;
  color: #d0d6e4;
}
.mem-card .mem-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-high   { background: #2a1018; color: var(--red); }
.badge-mid    { background: #1a1a10; color: var(--orange); }
.badge-low    { background: #101a14; color: var(--green); }
.badge-id     { background: #181030; color: var(--accent); }
.mem-card .mem-body { font-size: 13px; color: #808898; line-height: 1.5; margin-bottom: 6px; }
.mem-card .mem-foot {
  font-size: 11px;
  color: var(--dim);
  display: flex;
  gap: 8px;
}

/* ── 右侧面板 ── */
.sidebar {
  grid-column: 2;
  grid-row: 1 / 3;
  background: var(--surface);
  overflow-y: auto;
  padding: 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.sidebar .section-title {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 2px;
  margin-bottom: 10px;
  font-weight: 600;
}
.sidebar .section-title::before { content: '◆ '; color: var(--accent); font-size: 7px; }

/* 情绪 */
.emotion-main {
  text-align: center;
  padding: 16px 0;
}
.emotion-main .emotion-word {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: -1px;
  transition: color 0.6s;
}
.emotion-vibe {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.vibe-bar {
  flex: 1;
  text-align: center;
}
.vibe-bar .track {
  height: 4px;
  background: #1a1a30;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 4px;
}
.vibe-bar .fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
}
.vibe-bar .label {
  font-size: 10px;
  color: var(--dim);
}
.vibe-fill-v { background: linear-gradient(90deg, var(--red), var(--green)); }
.vibe-fill-a { background: linear-gradient(90deg, #34495e, var(--red)); }
.vibe-fill-d { background: linear-gradient(90deg, #34495e, var(--blue)); }

/* 身份 */
.identity-line {
  font-size: 14px;
  line-height: 1.7;
  color: #a0a8b8;
  padding: 10px 14px;
  background: var(--card);
  border-radius: 8px;
  border-left: 2px solid var(--accent);
}
.trait-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.trait-tag {
  padding: 4px 12px;
  background: #181030;
  border: 1px solid #2c1e52;
  border-radius: 10px;
  font-size: 11px;
  color: var(--accent-glow);
}

/* 驱动力 */
.drive-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 5px 0;
  font-size: 12px;
}
.drive-item .drive-name {
  width: 44px;
  text-align: right;
  color: var(--dim);
  flex-shrink: 0;
}
.drive-item .drive-bar {
  flex: 1;
  height: 5px;
  background: #1a1a30;
  border-radius: 3px;
  overflow: hidden;
}
.drive-item .drive-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--accent);
  transition: width 0.6s;
}
.drive-item .drive-val {
  width: 30px;
  text-align: right;
  font-size: 10px;
  color: var(--dim);
  flex-shrink: 0;
}

/* 好奇心 */
.curiosity-list { list-style: none; }
.curiosity-list li {
  padding: 6px 10px;
  margin: 3px 0;
  background: var(--card);
  border-radius: 6px;
  font-size: 12px;
  color: #9098a8;
  display: flex;
  gap: 6px;
  align-items: baseline;
}
.curiosity-list li .q-mark { color: var(--accent); font-weight: 700; flex-shrink: 0; }

/* 会话 */
.session-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  margin: 2px 0;
  border-radius: 5px;
  font-size: 12px;
}
.session-item:hover { background: var(--card); }
.session-item .s-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.s-dot.on { background: var(--green); }
.s-dot.idle { background: var(--orange); }
.session-item .s-name { font-weight: 600; min-width: 55px; }
.session-item .s-info { color: var(--dim); font-size: 11px; }

/* ── 底部输入 ── */
.input-bar {
  display: flex;
  gap: 10px;
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}
.input-bar select {
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.input-bar input {
  flex: 1;
  padding: 10px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s;
}
.input-bar input:focus { border-color: var(--accent); }
.input-bar button {
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: opacity 0.2s;
}
.input-bar button:hover { opacity: 0.85; }

.empty-note { color: var(--dim); font-size: 12px; padding: 8px 0; }

/* ── 滚动条 ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1e1e3d; border-radius: 2px; }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo">脑记忆 <span>v4.2</span></div>
  <div class="sep"></div>
  <div class="metric">心跳 <b id="ticks">0</b></div>
  <div class="metric">记忆 <b id="memcnt">0</b></div>
  <div class="metric">身份 v<b id="idver">1</b></div>
  <div class="state-badge state-awake" id="stateBadge">AWAKE</div>
</div>

<!-- 主体 -->
<div class="main">

  <!-- 独白 -->
  <div class="monologue-zone">
    <div class="quote-mark">"</div>
    <div class="monologue-text" id="monologue"></div>
  </div>

  <!-- 记忆 -->
  <div class="memory-zone">
    <div class="section-title">记忆碎片</div>
    <div class="mem-grid" id="memories"></div>
  </div>

  <!-- 侧栏 -->
  <div class="sidebar">
    <!-- 情绪 -->
    <div>
      <div class="section-title">当前情绪</div>
      <div class="emotion-main">
        <div class="emotion-word" id="emotionWord">—</div>
        <div style="font-size:12px;color:var(--dim);margin-top:4px">关注: <span id="focusEntity">—</span></div>
      </div>
      <div class="emotion-vibe">
        <div class="vibe-bar">
          <div class="track"><div class="fill vibe-fill-v" id="barV" style="width:50%"></div></div>
          <div class="label">愉悦</div>
        </div>
        <div class="vibe-bar">
          <div class="track"><div class="fill vibe-fill-a" id="barA" style="width:50%"></div></div>
          <div class="label">激活</div>
        </div>
        <div class="vibe-bar">
          <div class="track"><div class="fill vibe-fill-d" id="barD" style="width:50%"></div></div>
          <div class="label">掌控</div>
        </div>
      </div>
    </div>

    <!-- 自我 -->
    <div>
      <div class="section-title">自我认知</div>
      <div class="identity-line" id="identityText">加载中...</div>
      <div class="trait-tags" id="traitTags"></div>
    </div>

    <!-- 驱动 -->
    <div>
      <div class="section-title">内在驱动</div>
      <div id="drives"></div>
    </div>

    <!-- 好奇心 -->
    <div>
      <div class="section-title">正在好奇</div>
      <div id="curiosity"><div class="empty-note">暂无问题</div></div>
    </div>

    <!-- 会话 -->
    <div>
      <div class="section-title">连接中的 Agent</div>
      <div id="sessions"></div>
    </div>
  </div>

</div>

<!-- 输入 -->
<div class="input-bar">
  <select id="src">
    <option value="dashboard">控制台</option>
    <option value="hermes">Hermes</option>
    <option value="codex">Codex</option>
  </select>
  <input id="msg" placeholder="对它说点什么..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">发送</button>
</div>

<script>
// ── WebSocket 实时连接 ──
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
let ws = null;
let reconnectTimer = null;

function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  try {
    ws = new WebSocket(wsUrl);
    ws.onopen = function() {
      console.log('WS connected');
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };
    ws.onmessage = function(e) {
      const msg = JSON.parse(e.data);
      if (msg.type === 'brain_state' && msg.data) {
        render(msg.data);
      }
    };
    ws.onclose = function() {
      console.log('WS closed, reconnect in 3s');
      reconnectTimer = setTimeout(connectWS, 3000);
    };
    ws.onerror = function() { ws.close(); };
  } catch(e) {
    reconnectTimer = setTimeout(connectWS, 3000);
  }
}

// ── 轮询兜底 ──
let pollTimer = null;
function startPoll() {
  pollTimer = setInterval(async () => {
    if (ws && ws.readyState === WebSocket.OPEN) return; // WS 在线时不轮询
    try {
      const s = await fetch('/api/v4/state').then(r => r.json());
      render(s);
    } catch(e) {}
  }, 3000);
}

// ── 发送输入 ──
async function send() {
  const txt = document.getElementById('msg').value.trim();
  if (!txt) return;
  document.getElementById('msg').value = '';
  try {
    await fetch('/api/v4/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: txt, source: document.getElementById('src').value })
    });
    // 立即拉一次
    const s = await fetch('/api/v4/state').then(r => r.json());
    render(s);
  } catch(e) {}
}

// ── 渲染 ──
function render(s) {
  // 顶栏
  document.getElementById('ticks').textContent = s.total_ticks || 0;
  document.getElementById('idver').textContent = (s.self_model && s.self_model.identity_version) || 1;

  // 状态徽章
  const badge = document.getElementById('stateBadge');
  const sleepState = s.sleep_state || 'awake';
  badge.className = 'state-badge';
  if (sleepState === 'awake')      { badge.className += ' state-awake'; badge.textContent = '清醒'; }
  else if (sleepState === 'drowsy'){ badge.className += ' state-drowsy'; badge.textContent = '打盹'; }
  else if (sleepState.includes('sleep')) { badge.className += ' state-sleeping'; badge.textContent = '睡眠'; }
  else if (sleepState === 'dreaming'){ badge.className += ' state-dreaming'; badge.textContent = '梦境'; }

  // 独白
  const mo = s.inner_monologue || '';
  const moEl = document.getElementById('monologue');
  if (mo !== moEl.textContent) {
    moEl.style.opacity = '0';
    setTimeout(() => {
      moEl.textContent = mo;
      moEl.style.opacity = '1';
    }, 200);
  }

  // 情绪
  const labelMap = {
    'neutral': '#8899aa', 'breakthrough': '#2ecc71', 'excited': '#f1c40f',
    'failure': '#e74c3c', 'confused': '#f39c12', 'surprised': '#9b59b6',
    'worried': '#e67e22', 'frustrated': '#c0392b', 'satisfied': '#27ae60',
    'curious': '#3498db'
  };
  const emWord = document.getElementById('emotionWord');
  const emLabel = s.current_emotion || 'neutral';
  emWord.textContent = emLabel;
  emWord.style.color = labelMap[emLabel] || '#8899aa';
  document.getElementById('focusEntity').textContent = s.focus_entity || '—';

  const ev = s.emotion_vector || {};
  document.getElementById('barV').style.width = ((ev.valence || 0.5) * 100) + '%';
  document.getElementById('barA').style.width = ((ev.arousal || 0.5) * 100) + '%';
  document.getElementById('barD').style.width = ((ev.dominance || 0.5) * 100) + '%';

  // 自我
  const sm = s.self_model || {};
  document.getElementById('identityText').textContent = sm.identity_anchor || '我是脑记忆智能体。';
  document.getElementById('traitTags').innerHTML = (sm.identity_traits || []).map(t =>
    '<span class="trait-tag">' + t + '</span>'
  ).join('');

  // 驱动力
  const drives = sm.drives || {};
  document.getElementById('drives').innerHTML = Object.keys(drives).sort((a,b) =>
    (drives[b].weight || 0) - (drives[a].weight || 0)
  ).map(k => {
    const d = drives[k];
    const pct = Math.round((d.weight || 0) * 100);
    return '<div class="drive-item">' +
      '<span class="drive-name">' + d.label + '</span>' +
      '<div class="drive-bar"><div class="drive-fill" style="width:' + pct + '%"></div></div>' +
      '<span class="drive-val">' + pct + '%</span>' +
      '</div>';
  }).join('');

  // 好奇心
  const cur = s.curiosity || {};
  const qs = cur.open_questions || [];
  document.getElementById('curiosity').innerHTML = qs.length
    ? '<ul class="curiosity-list">' + qs.slice(0, 5).map(q =>
        '<li><span class="q-mark">?</span>' + (q.question || '') + '</li>'
      ).join('') + '</ul>'
    : '<div class="empty-note">暂无问题</div>';

  // 会话
  const sessions = s.sessions || {};
  const srcs = sessions.active_sources || [];
  const details = sessions.sessions || {};
  document.getElementById('sessions').innerHTML = srcs.length
    ? srcs.map(x => {
        const d = details[x] || {};
        const active = d.last_active ? (Date.now() - new Date(d.last_active).getTime()) / 1000 < 120 : false;
        return '<div class="session-item">' +
          '<span class="s-dot ' + (active ? 'on' : 'idle') + '"></span>' +
          '<span class="s-name">' + x + '</span>' +
          '<span class="s-info">' + (d.emotion || '?') + (d.focus ? ' · ' + d.focus : '') + '</span>' +
          '</div>';
      }).join('')
    : '<div class="empty-note">暂无连接</div>';

  // 记忆时间线
  // 从 memory-timeline 端点获取
  fetch('/api/v4/memory-timeline?limit=12').then(r => r.json()).then(mt => {
    document.getElementById('memcnt').textContent = mt.count || 0;
    const ms = mt.memories || [];
    document.getElementById('memories').innerHTML = ms.length
      ? ms.map(m => {
          const imp = m.importance || 0.5;
          const badgeCls = imp > 0.7 ? 'badge-high' : imp > 0.4 ? 'badge-mid' : 'badge-low';
          const isId = m.is_identity_forming;
          return '<div class="mem-card' + (isId ? ' identity' : '') + '">' +
            '<div class="mem-top">' +
              '<span class="mem-title">' + (m.title || '?') + '</span>' +
              '<span class="mem-badge ' + badgeCls + '">' + imp.toFixed(2) + '</span>' +
            '</div>' +
            '<div class="mem-body">' + (m.summary || '').substring(0, 120) + '</div>' +
            '<div class="mem-foot">' +
              '<span>' + (m.emotion_label || '') + '</span>' +
              '<span>' + (m.type || '') + '</span>' +
              '<span>' + (m.created || '').substring(0, 16).replace('T', ' ') + '</span>' +
              (isId ? '<span style="color:var(--accent)">身份记忆</span>' : '') +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="empty-note">暂无记忆。对它说点什么，它会记住的。</div>';
  }).catch(() => {});
}

// ── 启动 ──
connectWS();
startPoll();
// 初始拉取
fetch('/api/v4/state').then(r => r.json()).then(render).catch(() => {});
</script>
</body>
</html>
