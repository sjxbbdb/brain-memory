<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Memory v8.0 — State Field</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#06060f;--surface:#0e0e20;--card:#111128;--border:#1a1a3a;--text:#c8d0e0;--dim:#555570;--accent:#8b7cf0;--accent-glow:#a99ff8;--green:#2ecc71;--red:#e74c3c;--orange:#f39c12;--blue:#5dade2;--warn:#e67e22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px;line-height:1.6;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border);gap:14px;flex-shrink:0;background:var(--surface)}
.topbar .logo{font-size:17px;font-weight:800;letter-spacing:1px}.topbar .logo span{color:var(--accent)}
.topbar .sep{width:1px;height:16px;background:var(--border)}
.topbar .metric{font-size:12px;color:var(--dim)}.topbar .metric b{color:var(--text);font-weight:600}
.topbar .state-badge{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:700;margin-left:auto}
.state-awake{background:#0a2a1a;color:var(--green)}
.main{flex:1;display:grid;grid-template-columns:420px 1fr 340px;gap:1px;background:var(--border);overflow:hidden}
.panel{background:var(--surface);overflow-y:auto;padding:16px 20px}
.panel .section-title{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-bottom:10px;font-weight:600;text-transform:uppercase}
.panel .section-title::before{content:'◆ ';color:var(--accent);font-size:7px}
/* Radar */
.radar-wrap{background:var(--card);border-radius:10px;padding:8px;margin-bottom:14px}
.radar-wrap canvas{width:100% !important;height:320px !important}
/* Diffusion matrix */
.diff-table{width:100%;font-size:10px;border-collapse:collapse}
.diff-table th,.diff-table td{padding:2px 4px;text-align:center;border:1px solid #1a1a28}
.diff-table th{color:var(--dim);font-weight:600;font-size:9px}
.diff-table td.positive{color:var(--green)}.diff-table td.negative{color:var(--red)}.diff-table td.zero{color:var(--dim)}
/* State narrative */
.narrative-box{padding:10px 14px;background:var(--card);border-radius:8px;border-left:2px solid var(--accent);font-size:13px;color:#a0a8b8;margin-bottom:14px;line-height:1.8}
/* Closures */
.closure-list{list-style:none}.closure-list li{padding:4px 10px;margin:2px 0;background:var(--card);border-radius:4px;font-size:11px;color:var(--accent-glow);font-family:monospace}
/* Center - monologue */
.center-panel{display:flex;flex-direction:column;gap:12px}
.monologue-zone{padding:20px 24px;background:var(--card);border-radius:10px;min-height:80px;display:flex;gap:14px;align-items:flex-start}
.monologue-zone .quote{font-size:40px;color:var(--accent);opacity:0.25;flex-shrink:0;line-height:1;font-family:Georgia,serif}
.monologue-zone .mo-text{font-size:17px;line-height:1.8;color:#d8dce8;font-style:italic;transition:opacity 0.5s}
.response-line{display:none;padding:8px 14px;background:#0a1a1a;border-left:3px solid var(--accent);font-size:14px;color:#a0d0c0;border-radius:6px}
.response-line .rl{color:var(--accent);font-weight:700;margin-right:6px}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.mem-card{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px 14px}
.mem-card.identity{border-left:2px solid var(--accent)}
.mem-card .mt{font-weight:700;font-size:14px}.mem-card .mb{font-size:12px;color:#808898;margin:2px 0}.mem-card .mf{font-size:10px;color:var(--dim)}
/* Right sidebar */
.sidebar{display:flex;flex-direction:column;gap:14px}
.wm-item{padding:6px 10px;background:var(--card);border-radius:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;border-left:2px solid transparent}
.wm-item.emotion{border-left-color:var(--red)}.wm-item.goal{border-left-color:var(--blue)}.wm-item.identity{border-left-color:var(--accent)}
.wm-item .wm-score{font-size:11px;font-weight:700;min-width:36px;text-align:right}
.score-high{color:var(--green)}.score-mid{color:var(--orange)}.score-low{color:var(--dim)}
.drive-mini{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px}
.drive-mini .dm-bar{flex:1;height:4px;background:#1a1a30;border-radius:2px}.drive-mini .dm-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.5s}
.drive-mini .dm-label{width:40px;color:var(--dim);text-align:right}
.trait-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}.trait-tag{padding:3px 9px;background:#181030;border:1px solid #2c1e52;border-radius:8px;font-size:10px;color:var(--accent-glow)}
.input-bar{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.input-bar select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none}
.input-bar input{flex:1;padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none;transition:border-color 0.3s}
.input-bar input:focus{border-color:var(--accent)}
.input-bar button{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:0.5px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e1e3d;border-radius:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">脑记忆 <span>v8.0</span> · State Field</div>
  <div class="sep"></div>
  <div class="metric">心跳 <b id="ticks">0</b></div>
  <div class="metric">记忆 <b id="memcnt">0</b></div>
  <div class="metric">闭环 <b id="closures">0</b></div>
  <div class="metric">校准 <b id="cals">0</b></div>
  <span class="state-badge state-awake" id="stateBadge">清醒</span>
</div>

<div class="main">
  <!-- LEFT: State Field Radar + Diffusion -->
  <div class="panel">
    <div class="section-title">ActivationField · 14 维状态场</div>
    <div class="radar-wrap"><canvas id="radarChart"></canvas></div>
    <div class="narrative-box" id="narrative">等待状态场初始化...</div>
    <div class="section-title">状态闭环</div>
    <ul class="closure-list" id="closureList"><li style="color:var(--dim)">检测中...</li></ul>
  </div>

  <!-- CENTER: Monologue + Memories -->
  <div class="panel center-panel">
    <div class="monologue-zone">
      <div class="quote">"</div>
      <div class="mo-text" id="monologue">正在感知世界...</div>
    </div>
    <div class="response-line" id="responseLine"><span class="rl">💬</span><span id="responseText"></span></div>
    <div class="section-title">记忆碎片</div>
    <div class="mem-grid" id="memories"></div>
  </div>

  <!-- RIGHT: Working Memory + Identity -->
  <div class="panel sidebar">
    <div class="section-title">工作记忆 · SalienceScore</div>
    <div id="wmItems"></div>
    <div class="section-title">自我认知</div>
    <div style="font-size:13px;line-height:1.6;color:#a0a8b8;margin-bottom:6px" id="identityText">加载中...</div>
    <div class="trait-tags" id="traitTags"></div>
    <div class="section-title">内在驱动</div>
    <div id="drives"></div>
    <div class="section-title">情感表达</div>
    <div style="font-size:14px;color:#c0c8e0;font-style:italic" id="emotionExpr">—</div>
    <div class="section-title">扩散校准日志</div>
    <div style="font-size:10px;color:var(--dim);max-height:120px;overflow-y:auto" id="calLog">尚无校准</div>
  </div>
</div>

<div class="input-bar">
  <select id="src"><option value="dashboard">控制台</option><option value="hermes">Hermes</option></select>
  <input id="msg" placeholder="对它说点什么..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">发送</button>
</div>

<script>
// ══════ Chart.js Radar ══════
const dimLabels = ['愉悦度','唤醒度','掌控感','威胁','好奇','聚焦','信心','依恋','疲劳','不确定','生存','成长','探索','身份稳'];
const dimKeys = ['valence','arousal','dominance','fear','curiosity','focus','confidence','attachment','fatigue','uncertainty','survival_drive','growth_drive','exploration_drive','identity_stability'];

const ctx = document.getElementById('radarChart').getContext('2d');
const radar = new Chart(ctx, {
  type: 'radar',
  data: {
    labels: dimLabels,
    datasets: [{
      label: '当前状态',
      data: dimKeys.map(()=>0.5),
      backgroundColor: 'rgba(139,124,240,0.15)',
      borderColor: 'rgba(139,124,240,0.8)',
      borderWidth: 1.5,
      pointRadius: 2,
      pointBackgroundColor: 'rgba(169,159,248,1)',
    },{
      label: '基线',
      data: dimKeys.map(()=>0.5),
      backgroundColor: 'transparent',
      borderColor: 'rgba(85,85,112,0.4)',
      borderWidth: 1,
      borderDash: [3,3],
      pointRadius: 0,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: { r: { min:0, max:1, ticks:{stepSize:0.2,display:false,backdropColor:'transparent'}, grid:{color:'#1a1a30'}, pointLabels:{color:'#808898',font:{size:10}} } },
    plugins: { legend: { display: false } }
  }
});

// ══════ WebSocket + Poll ══════
const wsUrl = (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws = null;

function connectWS(){
  if(ws&&ws.readyState===WebSocket.OPEN)return;
  try{ws=new WebSocket(wsUrl);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='brain_state')renderV5(m.data)};ws.onclose=()=>setTimeout(connectWS,3000);ws.onerror=()=>ws.close()}catch(e){setTimeout(connectWS,3000)}
}

let pollTimer=null;
function startPoll(){
  pollTimer=setInterval(async()=>{
    try{
      const [sf,wm]=await Promise.all([fetch('/api/v6/state-field').then(r=>r.json()),fetch('/api/v6/working-memory-state').then(r=>r.json())]);
      renderV6(sf,wm);
    }catch(e){}
  },2000)
}

// ══════ Render V6 ══════
function renderV6(sf,wm){
  // Radar
  const vals = sf.values || {};
  const baselines = {};
  dimKeys.forEach(k => baselines[k]=0.5);
  radar.data.datasets[0].data = dimKeys.map(k=>vals[k]??0.5);
  radar.data.datasets[1].data = dimKeys.map(k=>baselines[k]??0.5);
  radar.update('none');

  // Narrative
  document.getElementById('narrative').textContent = sf.narrative || '状态场平衡';

  // Closures
  const closures = sf.closures || [];
  document.getElementById('closures').textContent = closures.length;
  document.getElementById('closureList').innerHTML = closures.length
    ? closures.slice(0,6).map(c=>'<li>'+c.join(' → ')+'</li>').join('')
    : '<li style="color:var(--dim)">未检测到闭环（需要更多 tick）</li>';

  // Total ticks
  document.getElementById('ticks').textContent = sf.total_ticks || 0;

  // Working memory
  const items = wm.items || [];
  document.getElementById('wmItems').innerHTML = items.length
    ? items.map(i=>{
        const cls = i.salience>0.4?'score-high':i.salience>0.2?'score-mid':'score-low';
        const cat = (i.emotion_w||0)>(i.goal_w||0)&&(i.emotion_w||0)>(i.identity_w||0)?'emotion':
                    (i.identity_w||0)>(i.emotion_w||0)?'identity':'goal';
        return '<div class="wm-item '+cat+'"><span>'+(i.content||'').substring(0,40)+'</span><span class="wm-score '+cls+'">'+(i.salience||0).toFixed(2)+'</span></div>';
      }).join('')
    : '<div style="font-size:11px;color:var(--dim)">工作记忆为空</div>';

  // Calibration log
  const rules = sf.diffusion?.rules || [];
  const calibrated = rules.filter(r=>Math.abs(r.weight)!==Math.abs((DEFAULT_WEIGHTS[r.src+'_'+r.dst]||0)));
  document.getElementById('cals').textContent = calibrated.length;
  document.getElementById('calLog').innerHTML = calibrated.length
    ? calibrated.slice(0,5).map(r=>r.src+'→'+r.dst+': '+r.weight.toFixed(2)+' ('+r.desc+')').join('<br>')
    : '尚无校准';
}

// Default weights for comparison
const DEFAULT_WEIGHTS = {};

function renderV5(s){
  document.getElementById('ticks').textContent = s.total_ticks||0;
  const mo = s.inner_monologue||'';
  const el = document.getElementById('monologue');
  if(el.textContent!==mo){el.style.opacity='0';setTimeout(()=>{el.textContent=mo||'正在感知世界...';el.style.opacity='1'},200)}

  const sleep = s.sleep_state||'awake';
  const badge = document.getElementById('stateBadge');
  badge.textContent = sleep==='awake'?'清醒':sleep.includes('sleep')?'睡眠':sleep;
  badge.className = 'state-badge state-awake';

  const li = s.last_intent;
  if(li&&li.type==='respond'&&li.response_text){
    document.getElementById('responseLine').style.display='block';
    document.getElementById('responseText').textContent = li.response_text;
  }

  const sm = s.self_model||{};
  document.getElementById('identityText').textContent = sm.identity_anchor||'';
  document.getElementById('traitTags').innerHTML = (sm.identity_traits||[]).map(t=>'<span class="trait-tag">'+t+'</span>').join('');
  const drives = sm.drives||{};
  document.getElementById('drives').innerHTML = Object.keys(drives).sort((a,b)=>(drives[b].weight||0)-(drives[a].weight||0)).map(k=>{
    const d=drives[k];const p=Math.round((d.weight||0)*100);
    return '<div class="drive-mini"><span class="dm-label">'+d.label+'</span><div class="dm-bar"><div class="dm-fill" style="width:'+p+'%"></div></div><span style="font-size:10px;color:var(--dim)">'+p+'%</span></div>'
  }).join('');

  const ev = s.emotion_vector||{};
  document.getElementById('emotionExpr').textContent = (ev.valence||0)>0.6?'😊 偏正面':(ev.valence||0)<0.4?'😟 偏负面':'😐 中性';

  fetch('/api/v4/memory-timeline?limit=9').then(r=>r.json()).then(mt=>{
    document.getElementById('memcnt').textContent = mt.count||0;
    document.getElementById('memories').innerHTML = (mt.memories||[]).map(m=>{
      const imp=m.importance||0.5;
      return '<div class="mem-card'+(m.is_identity_forming?' identity':'')+'"><div class="mt">'+(m.title||'?')+' <span style="font-size:10px;color:'+(imp>0.7?'var(--red)':imp>0.4?'var(--orange)':'var(--green)')+'">'+imp.toFixed(2)+'</span></div><div class="mb">'+(m.summary||'').substring(0,80)+'</div><div class="mf">'+(m.emotion_label||'')+' · '+(m.type||'')+' · '+(m.created||'').substring(0,16).replace('T',' ')+(m.is_identity_forming?' · <span style="color:var(--accent)">身份</span>':'')+'</div></div>'
    }).join('') || '<div style="color:var(--dim);font-size:12px">暂无记忆</div>'
  }).catch(()=>{});
}

async function send(){
  const txt = document.getElementById('msg').value.trim();if(!txt)return;
  document.getElementById('msg').value='';document.getElementById('msg').disabled=true;
  document.getElementById('monologue').textContent='正在理解...';
  try{
    await fetch('/api/v4/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,source:document.getElementById('src').value})});
    document.getElementById('msg').disabled=false;document.getElementById('msg').focus()
  }catch(e){document.getElementById('msg').disabled=false}
}

connectWS();startPoll();
fetch('/api/v4/state').then(r=>r.json()).then(renderV5).catch(()=>{});
fetch('/api/v6/state-field').then(r=>r.json()).then(sf=>fetch('/api/v6/working-memory-state').then(r=>r.json()).then(wm=>renderV6(sf,wm))).catch(()=>{});
</script>
</body>
</html>
